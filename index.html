<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>Budget Coach</title>
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/screens.css" />
</head>
<body>
  <div id="app">
    <main>
      <!-- ══ AUTH ═══════════════════════════════════════════ -->
      <section class="screen" id="auth-screen">
        <h1 id="app-title">Budget Coach</h1>
        <p class="muted">Plan on payday. Know what's safe to spend today.</p>

        <form class="card" id="auth-form" novalidate>
          <h2 id="auth-title">Welcome back</h2>
          <p class="notice" id="config-notice" hidden></p>
          <p class="error-text" id="auth-error" hidden></p>

          <label class="field" for="auth-email">
            <span>Email</span>
            <input class="input" id="auth-email" type="email" autocomplete="email" required />
          </label>

          <label class="field" for="auth-password">
            <span>Password</span>
            <input class="input" id="auth-password" type="password" autocomplete="current-password" required />
          </label>

          <button class="btn btn-primary" id="auth-submit" type="submit">Sign in</button>
          <div class="modal-actions">
            <button class="btn btn-link" id="auth-reset" type="button">Forgot password</button>
            <button class="btn btn-link" id="auth-toggle" type="button">No account? Sign up</button>
          </div>
        </form>
      </section>

      <!-- ══ HOME ═══════════════════════════════════════════ -->
      <section class="screen" id="home-screen">
        <h1>Budget Coach</h1>
        <p class="muted" id="home-email"></p>

        <button class="btn btn-primary" id="home-quickadd" type="button">+ Add entry</button>

        <nav class="screen-nav" id="home-nav">
          <button class="btn" type="button" data-screen="accounts-screen">Accounts</button>
          <button class="btn" type="button" data-screen="categories-screen">Categories</button>
        </nav>

        <div class="card">
          <h2>Your data</h2>
          <ul class="stack-list" id="home-counts"></ul>
        </div>

        <div class="card">
          <h2>Sync</h2>
          <p class="muted" id="sync-status" data-pending="0">All changes saved</p>
        </div>

        <button class="btn" id="sign-out" type="button">Sign out</button>
      </section>

      <!-- ══ ACCOUNTS ═══════════════════════════════════════ -->
      <section class="screen" id="accounts-screen">
        <h1>Accounts</h1>
        <button class="btn btn-link" type="button" onclick="Router.show('home-screen')">&larr; Back</button>
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h2>Your accounts</h2>
            <button class="btn btn-primary" id="accounts-add" type="button">Add</button>
          </div>
          <ul id="accounts-list"></ul>
        </div>
        <button class="btn btn-link" id="accounts-toggle-archived" type="button" hidden>Show archived</button>
      </section>

      <!-- ══ QUICK-ADD ════════════════════════════════════ -->
      <section class="screen" id="quickadd-screen">
        <div class="quickadd-header">
          <button class="btn btn-link" id="quickadd-back" type="button">&larr; Back</button>
          <div id="quickadd-type-row">
            <button class="btn btn-primary" id="quickadd-type-expense" type="button">Expense</button>
            <button class="btn" id="quickadd-type-income" type="button">Income</button>
          </div>
        </div>

        <div id="quickadd-amount">RM 0.00</div>

        <p class="error-text" id="quickadd-error" hidden></p>

        <div id="quickadd-chips"></div>

        <div id="quickadd-account-row">
          <label for="quickadd-account">Account</label>
          <select class="input" id="quickadd-account"></select>
        </div>

        <div id="quickadd-note-row" hidden>
          <input class="input" id="quickadd-note" type="text" placeholder="Note (optional)" />
        </div>
        <button class="btn btn-link" id="quickadd-note-toggle" type="button">Add note</button>

        <div id="quickadd-keypad">
          <button class="keypad-btn btn" type="button" data-key="1">1</button>
          <button class="keypad-btn btn" type="button" data-key="2">2</button>
          <button class="keypad-btn btn" type="button" data-key="3">3</button>
          <button class="keypad-btn btn" type="button" data-key="4">4</button>
          <button class="keypad-btn btn" type="button" data-key="5">5</button>
          <button class="keypad-btn btn" type="button" data-key="6">6</button>
          <button class="keypad-btn btn" type="button" data-key="7">7</button>
          <button class="keypad-btn btn" type="button" data-key="8">8</button>
          <button class="keypad-btn btn" type="button" data-key="9">9</button>
          <button class="keypad-btn btn" type="button" data-key=".">.</button>
          <button class="keypad-btn btn" type="button" data-key="0">0</button>
          <button class="keypad-btn btn" type="button" data-key="backspace" aria-label="Backspace">&#9003;</button>
        </div>

        <button class="btn btn-primary quickadd-save" id="quickadd-save" type="button">Save</button>
      </section>

      <!-- ══ CATEGORIES ═════════════════════════════════ -->
      <section class="screen" id="categories-screen">
        <h1>Categories</h1>
        <button class="btn btn-link" type="button" onclick="Router.show('home-screen')">&larr; Back</button>
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h2>Your categories</h2>
            <button class="btn btn-primary" id="categories-add" type="button">Add</button>
          </div>
          <ul id="categories-list"></ul>
        </div>
        <button class="btn btn-link" id="categories-toggle-archived" type="button" hidden>Show archived</button>
      </section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="./js/config.js"></script>
  <script src="./js/util.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/store.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/sync.js"></script>
  <script src="./js/calc.js"></script>
  <script src="./js/router.js"></script>
  <script src="./js/screens/accounts.js"></script>
  <script src="./js/screens/categories.js"></script>
  <script src="./js/screens/quickadd.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
